name: Self-host image

on:
  push:
    branches: [selfhost/sqlite-github]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push the self-host image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ozanonurtek/intuneget:selfhost-${{ github.sha }}
            ghcr.io/ozanonurtek/intuneget:selfhost-latest
          labels: |
            org.opencontainers.image.source=https://github.com/ozanonurtek/IntuneGet

      - name: Record the pushed digest
        run: |
          {
            echo "## Self-host image"
            echo "- Tag: \`ghcr.io/ozanonurtek/intuneget:selfhost-${{ github.sha }}\`"
            echo "- Digest: \`ghcr.io/ozanonurtek/intuneget@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
